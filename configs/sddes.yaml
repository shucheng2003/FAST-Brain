dataset: sddes
seed: 37
roi_count: 66
history_len: 60
pred_len: 24
train_fraction: 0.8
data:
  signals:
    path: data/sddes/BOLD_signals.csv
    format: csv_header
  matrices:
    - name: sc
      path: data/sddes/SC_matrix.csv
      format: csv
      transform: normalize
    - name: length
      path: data/sddes/K_matrix.csv
      format: csv
      transform: inverse_normalize
    - name: network
      path: data/sddes/network_matrix.csv
      format: csv
      transform: normalize
model:
  use_rope: true
  d_model: 256
  n_heads: 8
  n_layers: 2
  d_ff: 1024
  dropout: 0.2
  gcn_hidden: 128
  gcn_order: 2
  euler_steps: 20
  denom_clamp: 0.05
training:
  epochs: 180
  batch_size: 256
  lr: 0.0002
  weight_decay: 0.0001
  mu_t: 0.2
  sigma_t: 0.8
  shuffle: false
  scheduler: true
  grad_clip: true
  eta_min: 0.000001
evaluation:
  num_runs: 10
  pred_steps:
  ci_bootstrap: 1000
  ci_level: 0.95
  ec_samples: 0
  conditional_samples: 100
  conditional_blocks: 0
